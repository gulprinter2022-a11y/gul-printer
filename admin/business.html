<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Gul Printer — Business Info Admin</title><link rel="stylesheet" href="/admin/common.css"></head><body class="loading"><div class="shell"><aside class="side"><div class="brand"><div><img src="/logo.svg" alt="Gul Printer"><p>Website Admin Panel</p></div></div><nav class="nav">

</nav><div class="bottom"><a class="sidebtn" href="/" target="_blank" rel="noopener">ویب سائٹ دیکھیں</a><button class="sidebtn logout" type="button" onclick="gpLogout()">لاگ آؤٹ</button></div></aside><main class="main"><header class="top"><div><h1>بزنس معلومات</h1><p class="sub">رابطہ، پتہ، نقشہ، سوشل میڈیا اور واٹس ایپ پیغام اپڈیٹ کریں۔</p></div><a class="btn soft" href="/admin/dashboard.html">ڈیش بورڈ</a></header><article class="panel" style="max-width:1000px"><form id="form"><div class="row">
<div class="field"><label>فون</label><input id="phone" class="ltr" type="text"></div><div class="field"><label>واٹس ایپ</label><input id="whatsapp" class="ltr" type="text"></div></div>
<div class="field"><label>ای میل</label><input id="email" class="ltr" type="email"></div>
<div class="field"><label>انگریزی پتہ</label><textarea id="addressEn" class="ltr"></textarea></div><div class="field"><label>اردو پتہ</label><textarea id="addressUr"></textarea></div>
<div class="field"><label>گوگل میپس لنک</label><input id="maps" class="ltr" type="url"></div>
<div class="row"><div class="field"><label>فیس بک</label><input id="facebook" class="ltr" type="url"></div><div class="field"><label>انسٹاگرام</label><input id="instagram" class="ltr" type="url"></div></div>
<div class="field"><label>ٹک ٹاک</label><input id="tiktok" class="ltr" type="url"></div>
<div class="row"><div class="field"><label>ہفتہ وار تعطیل</label><input id="holidayEn" class="ltr" type="text"></div><div class="field"><label>اردو تعطیل</label><input id="holidayUr" type="text"></div></div>
<div class="field"><label>واٹس ایپ کا انگریزی ابتدائی پیغام</label><textarea id="waEn" class="ltr"></textarea></div><div class="field"><label>واٹس ایپ کا اردو ابتدائی پیغام</label><textarea id="waUr"></textarea></div>
<div class="form-actions"><button id="saveBtn" class="btn primary">محفوظ کریں</button></div><div id="msg" class="msg"></div></form></article></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/common.js"></script>
<script>
const e=id=>document.getElementById(id);function note(t,type='ok'){e('msg').textContent=t;e('msg').className='msg '+type}
async function load(){const{data,error}=await gp.from('business_info').select('*').eq('id',1).single();if(error)return note(error.message,'error');const map={phone:'phone',whatsapp:'whatsapp',email:'email',address_en:'addressEn',address_ur:'addressUr',google_maps_url:'maps',facebook_url:'facebook',instagram_url:'instagram',tiktok_url:'tiktok',weekly_holiday_en:'holidayEn',weekly_holiday_ur:'holidayUr',whatsapp_default_message_en:'waEn',whatsapp_default_message_ur:'waUr'};for(const[k,id]of Object.entries(map))e(id).value=data[k]||''}
e('form').addEventListener('submit',async ev=>{ev.preventDefault();e('saveBtn').disabled=true;const p={phone:e('phone').value.trim()||null,whatsapp:e('whatsapp').value.trim()||null,email:e('email').value.trim()||null,address_en:e('addressEn').value.trim()||null,address_ur:e('addressUr').value.trim()||null,google_maps_url:e('maps').value.trim()||null,facebook_url:e('facebook').value.trim()||null,instagram_url:e('instagram').value.trim()||null,tiktok_url:e('tiktok').value.trim()||null,weekly_holiday_en:e('holidayEn').value.trim()||null,weekly_holiday_ur:e('holidayUr').value.trim()||null,whatsapp_default_message_en:e('waEn').value.trim()||null,whatsapp_default_message_ur:e('waUr').value.trim()||null};const{error}=await gp.from('business_info').update(p).eq('id',1);e('saveBtn').disabled=false;if(error)return note(error.message,'error');note('بزنس معلومات محفوظ ہو گئیں۔')});(async()=>{if(await gpRequireAdmin())await load()})();
</script></body></html>

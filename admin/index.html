<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#006BB0">
  <title>Gul Printer — Admin Login</title>
  <style>
    :root{--blue:#006BB0;--cyan:#00AEEF;--ink:#17384a;--muted:#6b7c86;--line:#dfe8ed;--danger:#b42318}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#f8fbfd,#eef7fb);color:var(--ink);display:grid;place-items:center;padding:24px}
    .wrap{width:min(100%,460px)}
    .card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 22px 60px rgba(14,65,91,.12);padding:30px}
    .brand{text-align:center;margin-bottom:24px}
    .brand img{width:190px;max-width:70%;height:auto}
    h1{font-size:25px;margin:14px 0 8px;text-align:center}
    .lead{margin:0 0 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
    label{display:block;font-weight:700;font-size:13px;margin:14px 0 7px}
    input{width:100%;padding:13px 14px;border:1px solid #cbd9e0;border-radius:12px;font:inherit;direction:ltr;text-align:left;background:#fff}
    input:focus{outline:2px solid rgba(0,174,239,.18);border-color:var(--cyan)}
    button{width:100%;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}
    .primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;margin-top:18px}
    .primary:disabled{opacity:.6;cursor:not-allowed}
    .note{font-size:12px;color:var(--muted);line-height:1.8;margin-top:16px;text-align:center}
    .msg{display:none;margin-top:16px;padding:11px 12px;border-radius:10px;font-size:13px;line-height:1.7}
    .msg.error{display:block;background:#fff1f0;color:var(--danger);border:1px solid #ffd2cf}
    .back{display:block;text-align:center;margin-top:18px;color:var(--blue);font-size:13px;font-weight:700}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="brand"><img src="/logo.svg" alt="Gul Printer"></div>
      <h1>ایڈمن لاگ اِن</h1>
      <p class="lead">ویب سائٹ کے انتظام کے لیے محفوظ رسائی</p>

      <form id="loginForm">
        <label for="email">ای میل</label>
        <input id="email" type="email" value="gulprinter.web@gmail.com" readonly autocomplete="username">

        <label for="password">پاس ورڈ</label>
        <input id="password" type="password" minlength="8" required autocomplete="current-password">

        <button id="loginBtn" class="primary" type="submit">لاگ اِن</button>
      </form>

      <p class="note">صرف مقررہ ایڈمن اکاؤنٹ کو رسائی حاصل ہے۔</p>
      <div id="message" class="msg" role="status" aria-live="polite"></div>
      <a class="back" href="/">ویب سائٹ پر واپس جائیں</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wuimmoxrcichlwwpnzbf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_a93iXNGXcc3tdky9guWfIQ_VvEoQz3X';
    const ADMIN_EMAIL = 'gulprinter.web@gmail.com';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('loginForm');
    const password = document.getElementById('password');
    const button = document.getElementById('loginBtn');
    const message = document.getElementById('message');

    function showError(text) {
      message.textContent = text;
      message.className = 'msg error';
    }

    async function verifyAdmin(user) {
      if (!user || String(user.email || '').toLowerCase() !== ADMIN_EMAIL) return false;
      const { data, error } = await client
        .from('admin_users')
        .select('user_id')
        .eq('user_id', user.id)
        .maybeSingle();
      return !error && !!data;
    }

    async function redirectIfSignedIn() {
      const { data: { session } } = await client.auth.getSession();
      if (session && await verifyAdmin(session.user)) {
        location.replace('/admin/dashboard.html');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.className = 'msg';
      button.disabled = true;

      const { data, error } = await client.auth.signInWithPassword({
        email: ADMIN_EMAIL,
        password: password.value
      });

      if (error) {
        button.disabled = false;
        showError('لاگ اِن نہیں ہوا۔ پاس ورڈ دوبارہ چیک کریں۔');
        return;
      }

      if (!(await verifyAdmin(data.user))) {
        await client.auth.signOut();
        button.disabled = false;
        showError('اس اکاؤنٹ کو ایڈمن اجازت حاصل نہیں ہے۔');
        return;
      }

      location.replace('/admin/dashboard.html');
    });

    redirectIfSignedIn();
  </script>
</body>
</html>

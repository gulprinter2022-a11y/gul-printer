<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Gul Printer — Founder Admin</title><link rel="stylesheet" href="/admin/common.css"></head><body class="loading"><div class="shell"><aside class="side"><div class="brand"><div><img src="/logo.svg" alt="Gul Printer"><p>Website Admin Panel</p></div></div><nav class="nav">

</nav><div class="bottom"><a class="sidebtn" href="/" target="_blank" rel="noopener">ویب سائٹ دیکھیں</a><button class="sidebtn logout" type="button" onclick="gpLogout()">لاگ آؤٹ</button></div></aside><main class="main"><header class="top"><div><h1>فاؤنڈر پروفائل</h1><p class="sub">فاؤنڈر کی تصویر، تعارف، عہدہ اور قابلیت یہاں سے اپڈیٹ کریں۔</p></div><a class="btn soft" href="/admin/dashboard.html">ڈیش بورڈ</a></header><article class="panel" style="max-width:900px"><form id="form"><div class="grid" style="grid-template-columns:280px 1fr">
<div><div id="preview" class="preview">تصویر کا پیش منظر</div><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></div>
<div><div class="field"><label>نام</label><input id="name" type="text" required></div><div class="row"><div class="field"><label>عہدہ</label><input id="desEn" class="ltr" type="text"></div><div class="field"><label>اردو عہدہ</label><input id="desUr" type="text"></div></div>
<div class="field"><label>انگریزی تعارف</label><textarea id="bioEn" class="ltr"></textarea></div><div class="field"><label>اردو تعارف</label><textarea id="bioUr"></textarea></div>
<div class="field"><label>تعلیمی قابلیت</label><textarea id="qualEn" class="ltr"></textarea></div><div class="field"><label>اردو تعلیمی قابلیت</label><textarea id="qualUr"></textarea></div>
<div class="form-actions"><button id="saveBtn" class="btn primary">محفوظ کریں</button></div><div id="msg" class="msg"></div></div></div></form></article></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/common.js"></script>
<script>
const e=id=>document.getElementById(id);let row=null;function note(t,type='ok'){e('msg').textContent=t;e('msg').className='msg '+type}
async function load(){const{data,error}=await gp.from('founder').select('*').eq('id',1).single();if(error)return note(error.message,'error');row=data;e('name').value=row.name||'';e('desEn').value=row.designation_en||'';e('desUr').value=row.designation_ur||'';e('bioEn').value=row.bio_en||'';e('bioUr').value=row.bio_ur||'';e('qualEn').value=row.qualifications_en||'';e('qualUr').value=row.qualifications_ur||'';if(row.photo_url)e('preview').innerHTML='<img src="'+gpEsc(row.photo_url)+'" alt="">'}
e('photo').addEventListener('change',()=>{const f=e('photo').files[0];if(f)e('preview').innerHTML='<img src="'+URL.createObjectURL(f)+'" alt="">'});
e('form').addEventListener('submit',async ev=>{ev.preventDefault();e('saveBtn').disabled=true;let up=null;try{const f=e('photo').files[0];if(f)up=await gpUpload(f,'founder',1200,.86);const p={name:e('name').value.trim(),designation_en:e('desEn').value.trim()||null,designation_ur:e('desUr').value.trim()||null,bio_en:e('bioEn').value.trim()||null,bio_ur:e('bioUr').value.trim()||null,qualifications_en:e('qualEn').value.trim()||null,qualifications_ur:e('qualUr').value.trim()||null};if(up){p.photo_url=up.url;p.photo_path=up.path}const{error}=await gp.from('founder').update(p).eq('id',1);if(error)throw error;if(up&&row?.photo_path&&row.photo_path!==up.path)await gp.storage.from(GP_BUCKET).remove([row.photo_path]);note('فاؤنڈر پروفائل محفوظ ہو گیا۔');await load()}catch(err){if(up?.path)await gp.storage.from(GP_BUCKET).remove([up.path]);note(err.message||'محفوظ نہیں ہو سکا۔','error')}finally{e('saveBtn').disabled=false}});
(async()=>{if(await gpRequireAdmin())await load()})();
</script></body></html>

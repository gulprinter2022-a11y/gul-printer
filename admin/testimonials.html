<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Gul Printer — Reviews Admin</title><link rel="stylesheet" href="/admin/common.css"></head><body class="loading"><div class="shell"><aside class="side"><div class="brand"><div><img src="/logo.svg" alt="Gul Printer"><p>Website Admin Panel</p></div></div><nav class="nav">
<a class="nav-item " href="/admin/dashboard.html"><span class="dot"></span>ڈیش بورڈ</a>
<a class="nav-item " href="/admin/portfolio.html"><span class="dot"></span>پورٹ فولیو</a>
<a class="nav-item " href="/admin/clients.html"><span class="dot"></span>کلائنٹس</a>
<a class="nav-item active" href="/admin/testimonials.html"><span class="dot"></span>ریویوز</a>
<a class="nav-item " href="/admin/founder.html"><span class="dot"></span>فاؤنڈر</a>
<a class="nav-item " href="/admin/business.html"><span class="dot"></span>بزنس معلومات</a>
<a class="nav-item " href="/admin/homepage.html"><span class="dot"></span>ہوم پیج</a>
</nav><div class="bottom"><a class="sidebtn" href="/" target="_blank" rel="noopener">ویب سائٹ دیکھیں</a><button class="sidebtn logout" type="button" onclick="gpLogout()">لاگ آؤٹ</button></div></aside><main class="main"><header class="top"><div><h1>ریویوز مینجمنٹ</h1><p class="sub">صرف حقیقی اور تصدیق شدہ کسٹمر رائے شامل کریں۔</p></div><div class="actions"><a class="btn soft" href="/admin/dashboard.html">ڈیش بورڈ</a><button id="newBtn" class="btn primary">نیا ریویو</button></div></header>
<section class="grid"><article class="panel sticky" id="formPanel"><div class="title"><h2 id="formTitle">نیا ریویو</h2></div><form id="form">
<input id="editId" type="hidden"><div class="field"><label>کسٹمر نام</label><input id="customer" type="text" required maxlength="150"></div>
<div class="field"><label>ادارہ / کمپنی</label><input id="org" type="text" maxlength="180"></div>
<div class="field"><label>انگریزی ریویو</label><textarea id="reviewEn" class="ltr" maxlength="1200"></textarea></div>
<div class="field"><label>اردو ریویو</label><textarea id="reviewUr" maxlength="1200"></textarea></div>
<div class="field"><label>ترتیب نمبر</label><input id="order" class="ltr" type="number" min="0" max="9999" value="0"></div>
<div class="row"><label class="check"><input id="verified" type="checkbox" checked> تصدیق شدہ</label><label class="check"><input id="visible" type="checkbox" checked> ویب سائٹ پر دکھائیں</label></div>
<label class="check" style="margin-top:10px"><input id="featured" type="checkbox"> ہوم پیج پر نمایاں</label>
<div class="form-actions"><button id="saveBtn" class="btn primary">محفوظ کریں</button><button id="cancelBtn" class="btn soft" type="button" style="display:none">منسوخ</button></div><div id="msg" class="msg"></div></form></article>
<article class="panel"><div class="title"><h2>محفوظ ریویوز</h2><span id="total" class="tag">0</span></div><div class="toolbar"><input id="search" type="text" placeholder="ریویو تلاش کریں"><select id="filter"><option value="all">سب</option><option value="visible">صرف ظاہر</option><option value="hidden">صرف مخفی</option><option value="featured">صرف نمایاں</option></select></div><div id="items" class="items"><div class="empty">مواد لوڈ ہو رہا ہے…</div></div></article></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/common.js"></script>
<script>
const e=id=>document.getElementById(id),el={form:e('form'),editId:e('editId'),customer:e('customer'),org:e('org'),reviewEn:e('reviewEn'),reviewUr:e('reviewUr'),order:e('order'),verified:e('verified'),visible:e('visible'),featured:e('featured'),saveBtn:e('saveBtn'),cancelBtn:e('cancelBtn'),msg:e('msg'),items:e('items'),search:e('search'),filter:e('filter'),total:e('total'),formTitle:e('formTitle')};let rows=[];
function note(t,type='ok'){el.msg.textContent=t;el.msg.className='msg '+type}function reset(){el.form.reset();el.editId.value='';el.order.value='0';el.verified.checked=true;el.visible.checked=true;el.featured.checked=false;el.cancelBtn.style.display='none';el.formTitle.textContent='نیا ریویو';el.msg.className='msg'}
async function load(){const{data,error}=await gp.from('testimonials').select('*').order('display_order',{ascending:true}).order('created_at',{ascending:false});if(error){el.items.innerHTML='<div class="empty">مواد لوڈ نہیں ہو سکا۔</div>';return}rows=data||[];render()}
function render(){const q=el.search.value.trim().toLowerCase(),f=el.filter.value,list=rows.filter(r=>{const h=[r.customer_name,r.organization,r.review_en,r.review_ur].join(' ').toLowerCase();if(q&&!h.includes(q))return false;if(f==='visible'&&!r.is_visible)return false;if(f==='hidden'&&r.is_visible)return false;if(f==='featured'&&!r.featured)return false;return true});el.total.textContent=rows.length+' ریویوز';if(!list.length){el.items.innerHTML='<div class="empty">کوئی ریویو موجود نہیں۔</div>';return}el.items.innerHTML=list.map(r=>'<article class="item"><h3>'+gpEsc(r.customer_name)+'</h3>'+(r.organization?'<p>'+gpEsc(r.organization)+'</p>':'')+'<p>'+gpEsc(r.review_ur||r.review_en||'')+'</p><div class="meta">'+(r.verified?'<span class="tag vis">تصدیق شدہ</span>':'<span class="tag hid">غیر تصدیق شدہ</span>')+(r.is_visible?'<span class="tag vis">ظاہر</span>':'<span class="tag hid">مخفی</span>')+(r.featured?'<span class="tag featured">نمایاں</span>':'')+'<span class="tag">ترتیب: '+Number(r.display_order||0)+'</span></div><div class="item-actions"><button class="mini edit" data-a="edit" data-id="'+r.id+'">ترمیم</button><button class="mini" data-a="toggle" data-id="'+r.id+'">'+(r.is_visible?'چھپائیں':'دکھائیں')+'</button><button class="mini delete" data-a="delete" data-id="'+r.id+'">حذف</button></div></article>').join('')}
function edit(id){const r=rows.find(x=>x.id===id);if(!r)return;el.editId.value=r.id;el.customer.value=r.customer_name||'';el.org.value=r.organization||'';el.reviewEn.value=r.review_en||'';el.reviewUr.value=r.review_ur||'';el.order.value=Number(r.display_order||0);el.verified.checked=!!r.verified;el.visible.checked=!!r.is_visible;el.featured.checked=!!r.featured;el.formTitle.textContent='ریویو میں ترمیم';el.cancelBtn.style.display='inline-block';e('formPanel').scrollIntoView({behavior:'smooth'})}
el.form.addEventListener('submit',async ev=>{ev.preventDefault();el.saveBtn.disabled=true;const p={customer_name:el.customer.value.trim(),organization:el.org.value.trim()||null,review_en:el.reviewEn.value.trim()||null,review_ur:el.reviewUr.value.trim()||null,verified:el.verified.checked,is_visible:el.visible.checked,featured:el.featured.checked,display_order:Number(el.order.value||0)};let error;if(el.editId.value)({error}=await gp.from('testimonials').update(p).eq('id',el.editId.value));else({error}=await gp.from('testimonials').insert(p));el.saveBtn.disabled=false;if(error)return note(error.message,'error');note('محفوظ ہو گیا۔');await load();setTimeout(reset,500)});
el.items.addEventListener('click',async ev=>{const b=ev.target.closest('button[data-a]');if(!b)return;const r=rows.find(x=>x.id===b.dataset.id);if(!r)return;if(b.dataset.a==='edit')return edit(r.id);if(b.dataset.a==='toggle'){await gp.from('testimonials').update({is_visible:!r.is_visible}).eq('id',r.id);return load()}if(b.dataset.a==='delete'&&confirm('کیا آپ واقعی یہ ریویو حذف کرنا چاہتے ہیں؟')){await gp.from('testimonials').delete().eq('id',r.id);if(el.editId.value===r.id)reset();await load()}});
el.search.addEventListener('input',render);el.filter.addEventListener('change',render);el.cancelBtn.addEventListener('click',reset);e('newBtn').addEventListener('click',()=>{reset();e('formPanel').scrollIntoView({behavior:'smooth'})});(async()=>{if(await gpRequireAdmin())await load()})();
</script></body></html>
